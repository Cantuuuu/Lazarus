name: vision_assistant — Tests

on:
  push:
    branches: [main]
    paths:
      - "vision_assistant/**"
      - ".github/workflows/test-vision.yml"
  pull_request:
    branches: [main]
    paths:
      - "vision_assistant/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision_assistant

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vision_assistant/requirements.txt

      - name: Install system deps
        run: sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg portaudio19-dev

      - name: Install Python deps
        # onnxruntime-gpu → CPU build en CI (sin GPU)
        run: |
          pip install -r requirements.txt \
            --extra-index-url https://pypi.org/simple \
            || pip install -r requirements.txt \
              --extra-index-url https://pypi.org/simple \
              --ignore-requires-python

      - name: Force CPU onnxruntime in CI
        run: |
          pip uninstall -y onnxruntime-gpu || true
          pip install onnxruntime>=1.16.0

      - name: Run tests
        env:
          DISPLAY: ""
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-vision
          path: vision_assistant/tests/
