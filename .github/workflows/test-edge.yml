name: edge_computing_OPI5MX — Tests

on:
  push:
    branches: [main]
    paths:
      - "edge_computing_OPI5MX/**"
      - ".github/workflows/test-edge.yml"
  pull_request:
    branches: [main]
    paths:
      - "edge_computing_OPI5MX/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge_computing_OPI5MX

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: edge_computing_OPI5MX/requirements.txt

      - name: Install system deps
        run: sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/unit/ -v --tb=short --cov=core --cov=services --cov=modes --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-edge
          path: edge_computing_OPI5MX/.coverage
